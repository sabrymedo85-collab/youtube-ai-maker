<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صانع فيديوهات يوتيوب بالذكاء الاصطناعي</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      padding: 20px;
    }

    .box {
      max-width: 600px;
      margin: auto;
      background: #1d1d1d;
      padding: 25px;
      border-radius: 20px;
    }

    h1 {
      text-align: center;
    }

    textarea {
      width: 100%;
      height: 150px;
      box-sizing: border-box;
      padding: 15px;
      border-radius: 12px;
      border: none;
      margin-top: 10px;
      font-size: 16px;
      direction: rtl;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 15px;
      border: none;
      border-radius: 12px;
      background: #ff3333;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: #292929;
      border-radius: 12px;
      display: none;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>🎬 صانع فيديوهات يوتيوب</h1>

    <p>اكتب فكرة الفيديو:</p>

    <textarea id="prompt"
      placeholder="مثال: أسد صغير يتعلم كيف يصبح ملك الغابة..."></textarea>

    <button onclick="createVideo()">
      🚀 إنشاء الفيديو
    </button>

    <div id="result"></div>

  </div>

  <script>
    function createVideo() {

      const prompt = document.getElementById("prompt").value;
      const result = document.getElementById("result");

      if (prompt.trim() === "") {
        alert("اكتب فكرة الفيديو أولاً");
        return;
      }

      result.style.display = "block";

      result.innerHTML = `
        <h3>جاري تجهيز الفيديو...</h3>
        <p>✓ استلام الفكرة</p>
        <p>✓ تجهيز السيناريو</p>
        <p>✓ تقسيم المشاهد</p>
        <p>⏳ جاري تجهيز محرك الفيديو...</p>
      `;
    }
  </script>

</body>
</html>
